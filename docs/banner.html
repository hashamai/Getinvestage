<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: #0a0b0d;
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      }

      /* LinkedIn personal cover: 1584 x 396.
         Profile photo overlays the lower-LEFT, so the lockup sits right. */
      .banner {
        position: relative;
        width: 1584px;
        height: 396px;
        background: #0a0b0d;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        justify-content: center;
        padding: 0 76px 0 0;
      }

      .trace { position: absolute; inset: 0; }

      /* keeps the lower-left calm behind the avatar */
      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          520px 300px at 12% 88%,
          #0a0b0d 40%,
          rgba(10, 11, 13, 0) 100%
        );
        z-index: 1;
      }

      .grain { position: absolute; inset: 0; }
      .dot { position: absolute; border-radius: 50%; background: #ededed; }

      .content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        text-align: right;
      }

      .rule {
        width: 300px;
        height: 1px;
        background: rgba(255, 255, 255, 0.1);
        margin-bottom: 24px;
      }

      .lockup { display: flex; align-items: center; gap: 18px; }

      .mark { width: 42px; height: 42px; flex-shrink: 0; display: block; }

      .wordmark {
        font-size: 54px;
        font-weight: 600;
        letter-spacing: -0.015em;
        color: #ededed;
        line-height: 1;
      }

      .tagline {
        margin-top: 22px;
        font-size: 19px;
        color: #9ba0a6;
      }
      .tagline em { font-style: italic; color: #5c6167; }

      .micro {
        margin-top: 28px;
        display: flex;
        align-items: center;
        gap: 11px;
        font-size: 10.5px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #5c6167;
      }

      .live-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #4ec58f;
      }

      .tape {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        justify-content: flex-end;
        gap: 32px;
        padding: 12px 76px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        font-size: 11.5px;
        z-index: 2;
      }

      .q { display: inline-flex; gap: 7px; align-items: baseline; }
      .q .s { color: #5c6167; font-weight: 700; letter-spacing: 0.08em; }
      .q .p { color: #ededed; }
      .up { color: #4ec58f; }
      .down { color: #e0655c; }
    </style>
  </head>
  <body>
    <div class="banner">
      <svg class="trace" viewBox="0 0 1584 396" preserveAspectRatio="none">
        <path
          d="M0,300 L66,286 L132,308 L198,268 L264,282 L330,242 L396,262 L462,222 L528,246 L594,204 L660,232 L726,190 L792,214 L858,172 L924,198 L990,156 L1056,182 L1122,138 L1188,166 L1254,122 L1320,150 L1386,104 L1452,132 L1518,88 L1584,60"
          fill="none"
          stroke="#ededed"
          stroke-width="1"
          opacity="0.13"
        />
        <path
          d="M0,300 L66,286 L132,308 L198,268 L264,282 L330,242 L396,262 L462,222 L528,246 L594,204 L660,232 L726,190 L792,214 L858,172 L924,198 L990,156 L1056,182 L1122,138 L1188,166 L1254,122 L1320,150 L1386,104 L1452,132 L1518,88 L1584,60 L1584,396 L0,396 Z"
          fill="#ededed"
          opacity="0.018"
        />
        <circle cx="1518" cy="88" r="3" fill="#ededed" opacity="0.45" />
      </svg>

      <div class="vignette"></div>

      <div class="grain">
        <span class="dot" style="left: 62%; top: 18%; width: 2px; height: 2px; opacity: 0.1"></span>
        <span class="dot" style="left: 84%; top: 30%; width: 3px; height: 3px; opacity: 0.07"></span>
        <span class="dot" style="left: 74%; top: 72%; width: 2px; height: 2px; opacity: 0.08"></span>
        <span class="dot" style="left: 92%; top: 55%; width: 2px; height: 2px; opacity: 0.09"></span>
        <span class="dot" style="left: 55%; top: 44%; width: 1px; height: 1px; opacity: 0.12"></span>
        <span class="dot" style="left: 46%; top: 24%; width: 2px; height: 2px; opacity: 0.06"></span>
      </div>

      <div class="content">
        <div class="rule"></div>
        <div class="lockup">
          <svg class="mark" viewBox="0 0 100 100">
            <path d="M50 4 L96 50 L50 96 L4 50 Z" fill="#EDEDED" />
          </svg>
          <span class="wordmark">getinvestage</span>
        </div>
        <div class="tagline">The market, <em>thinking out loud.</em></div>
        <div class="micro">
          <span class="live-dot"></span>
          <span>AI market assistant &nbsp;·&nbsp; live data &nbsp;·&nbsp; plain english</span>
        </div>
      </div>

      <div class="tape">
        <span class="q"><span class="s">AAPL</span><span class="p">308.63</span><span class="up">+4.84%</span></span>
        <span class="q"><span class="s">NVDA</span><span class="p">194.83</span><span class="down">−1.39%</span></span>
        <span class="q"><span class="s">MSFT</span><span class="p">390.49</span><span class="up">+1.62%</span></span>
        <span class="q"><span class="s">TSLA</span><span class="p">393.45</span><span class="down">−7.49%</span></span>
        <span class="q"><span class="s">META</span><span class="p">582.90</span><span class="down">−4.90%</span></span>
      </div>
    </div>
  </body>
</html>
