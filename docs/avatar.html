<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: #0a0b0d;
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      }

      /* 400x400 — LinkedIn / X avatar. The mark sits inside the inscribed
         circle, so nothing clips when platforms round-crop it. */
      .avatar {
        position: relative;
        width: 400px;
        height: 400px;
        background: #0a0b0d;
        overflow: hidden;
        display: grid;
        place-items: center;
      }

      .glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          150px 150px at 50% 46%,
          rgba(255, 255, 255, 0.07),
          rgba(255, 255, 255, 0) 70%
        );
      }

      .trace { position: absolute; inset: 0; }

      .ring {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 336px;
        height: 336px;
        margin: -168px 0 0 -168px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.07);
      }

      .diamond {
        position: relative;
        z-index: 2;
        width: 132px;
        height: 132px;
        background: #ededed;
        transform: rotate(45deg);
      }
    </style>
  </head>
  <body>
    <div class="avatar" id="avatar">
      <div class="glow"></div>
      <svg class="trace" viewBox="0 0 400 400" preserveAspectRatio="none">
        <path
          d="M0,300 L40,288 L80,306 L120,272 L160,284 L200,250 L240,266 L280,232 L320,250 L360,214 L400,232"
          fill="none"
          stroke="#ededed"
          stroke-width="1"
          opacity="0.06"
        />
        <path
          d="M0,150 L40,138 L80,158 L120,124 L160,140 L200,106 L240,124 L280,90 L320,110 L360,74 L400,92"
          fill="none"
          stroke="#ededed"
          stroke-width="1"
          opacity="0.04"
        />
      </svg>
      <div class="ring"></div>
      <span class="diamond"></span>
    </div>
  </body>
</html>
